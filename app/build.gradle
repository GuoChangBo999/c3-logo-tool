plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.yuluoqc.c3mirror'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.yuluoqc.c3mirror"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            // Keep this list minimal and NEVER exclude META-INF/versions/**
            // wholesale - historically that is exactly what deleted the
            // BouncyCastle X25519/Ed25519 SPIs and produced
            // "no such algorithm: X25519 for provider BC".
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/INDEX.LIST',
                    // Duplicate OSGI manifests jar-to-jar (bcprov vs bcpkix).
                    'META-INF/versions/**/OSGI-INF/MANIFEST.MF',
                    'META-INF/*.SF',
                    'META-INF/*.DSA',
                    'META-INF/*.RSA'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // SSH client (same lib as original app) + its deps
    // sshj brings its own (multi-release!) BouncyCastle 1.75 transitively.
    // That both duplicates resources and would undo our X25519 fix, so every
    // org.bouncycastle module is excluded here - we ship the flattened copy
    // from app/libs instead.
    implementation('com.hierynomus:sshj:0.38.0') {
        exclude group: 'org.bouncycastle'
    }
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation('com.github.mwiede:jsch:0.2.20') {
        exclude group: 'org.bouncycastle'
    }

    // BouncyCastle is NOT pulled from Maven: those artifacts are Java-9
    // multi-release jars, and D8 (as used by AGP) does not implement
    // multi-release lookup, so the JDK-8 *stub* classes win and X25519 /
    // Ed25519 SPIs end up missing at runtime
    //   -> "no such algorithm: X25519 for provider BC"
    // app/libs/*.jar are the same artefacts with META-INF/versions/11/**
    // hoisted to the jar root (stubs replaced by the real implementations).
    // See tools/flatten_bc.py in this repo to regenerate them.
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// Belt and braces: no matter which dependency tries to pull BouncyCastle,
// it must never come from Maven (only app/libs/*.jar may provide it).
configurations.all {
    exclude group: 'org.bouncycastle'
}
