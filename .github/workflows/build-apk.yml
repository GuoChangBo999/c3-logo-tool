name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 npm 依赖
        run: npm install

      - name: 构建前端 (Vite)
        run: npm run build

      # 用 Capacitor 自动生成 android 原生工程（含 gradle wrapper / 图标 / 主题）
      - name: 生成 Android 工程
        run: npx cap add android

      - name: 同步 Web 资源
        run: npx cap sync android

      # 注入自定义原生 SSH 插件
      - name: 注入 C3Ssh 原生插件
        run: |
          PKG_DIR="android/app/src/main/java/com/openpilot/c3logo"
          mkdir -p "$PKG_DIR"
          cp native-overlay/C3SshPlugin.java "$PKG_DIR/C3SshPlugin.java"
          cp native-overlay/MainActivity.java "$PKG_DIR/MainActivity.java"

      # 注入 SSHJ 依赖 + 排除重复 META-INF
      - name: 注入 SSHJ 依赖
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          deps = """
              implementation 'com.hierynomus:sshj:0.38.0'
              implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
              implementation 'org.bouncycastle:bcpkix-jdk15to18:1.78.1'
              implementation 'com.jcraft:jzlib:1.1.3'
              implementation 'net.i2p.crypto:eddsa:0.3.0'
          """
          s = re.sub(r'(dependencies\s*\{)', r'\1' + deps, s, count=1)

          # 排除重复的 META-INF 文件（SSHJ/BouncyCastle 会冲突）
          pack = """
              packagingOptions {
                  resources {
                      excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                                    'META-INF/DEPENDENCIES',
                                    'META-INF/LICENSE*',
                                    'META-INF/NOTICE*',
                                    'META-INF/*.SF',
                                    'META-INF/*.DSA',
                                    'META-INF/*.RSA',
                                    'META-INF/INDEX.LIST']
                      pickFirsts += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
                  }
              }
          """
          # 插入到 android {} 块内（在 defaultConfig 前）
          s = re.sub(r'(\n\s*defaultConfig\s*\{)', pack + r'\1', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print("SSHJ 依赖 + packagingOptions 注入完成")
          PY

      # 注入网络/存储权限
      - name: 注入权限
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
            '<uses-permission android:name="android.permission.INTERNET" />',
            '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />',
            '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />',
          ]
          block = "\n    ".join(x for x in perms if x not in s)
          if block and '</manifest>' in s:
              s = s.replace('</manifest>', '    ' + block + '\n</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          print("权限注入完成")
          PY

      - name: Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: c3-logo-tool-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30