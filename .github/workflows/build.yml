name: Build APK

on:
  push:
    branches: [ c3mirror ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Show APK path
        run: find . -name "*.apk" -type f

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/c3mirror-debug.apk
          ls -la out/

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: c3mirror-debug-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: C3Mirror build ${{ github.run_number }}
          body: |
            自动构建的 C3 超级投屏 APK
            commit ${{ github.sha }}
          files: out/c3mirror-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore